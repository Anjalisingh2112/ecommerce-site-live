<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FashionStore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">FashionStore</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </nav>
  </header>

  <section class="login-register">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="text" id="loginUsername" placeholder="Username" required><br><br>
      <input type="password" id="loginPassword" placeholder="Password" required><br><br>
      <button type="submit">Login</button>
    </form>
    <p id="loginMessage" style="color:red;"></p>
  </section>

  <script>
    const loginForm = document.getElementById('loginForm');
    loginForm.addEventListener('submit', function(e){
      e.preventDefault();
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;

      // Check localStorage for user
      const user = JSON.parse(localStorage.getItem(username));
      if(user && user.password === password){
        alert("Login successful! Welcome, " + username);
        window.location.href = "index.html";
      } else {
        document.getElementById('loginMessage').textContent = "Invalid username or password";
      }
    });
  </script>
</body>
</html>
