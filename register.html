<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - FashionStore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">FashionStore</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
    </nav>
  </header>

  <section class="login-register">
    <h2>Register</h2>
    <form id="registerForm">
      <input type="text" id="registerUsername" placeholder="Username" required><br><br>
      <input type="password" id="registerPassword" placeholder="Password" required><br><br>
      <button type="submit">Register</button>
    </form>
    <p id="registerMessage" style="color:green;"></p>
  </section>

  <script>
    const registerForm = document.getElementById('registerForm');
    registerForm.addEventListener('submit', function(e){
      e.preventDefault();
      const username = document.getElementById('registerUsername').value;
      const password = document.getElementById('registerPassword').value;

      if(localStorage.getItem(username)){
        document.getElementById('registerMessage').textContent = "Username already exists!";
        document.getElementById('registerMessage').style.color = "red";
      } else {
        localStorage.setItem(username, JSON.stringify({password: password}));
        document.getElementById('registerMessage').textContent = "Registration successful! You can login now.";
        document.getElementById('registerMessage').style.color = "green";
      }
    });
  </script>
</body>
</html>
